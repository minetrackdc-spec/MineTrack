name: MineTrack
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  MineTrack:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minetrackdc.minetrack
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MineTrack
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Autoriser la prise de photos dans MineTrack."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Utiliser votre position dans MineTrack."
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
schemes:
  MineTrack:
    build:
      targets:
        MineTrack: all
